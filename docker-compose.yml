services:
  db:
    image: postgis/postgis:15-3.3
    container_name: webgis_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: webgis_db
    ports:
      - "5432:5432"

  api:
    build: ./backend  # <-- Pastikan baris ini mengarah ke folder backend
    container_name: webgis_api
    ports:
      - "5000:5000"
    depends_on:
      - db